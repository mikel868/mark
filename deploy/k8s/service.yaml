apiVersion: v1
kind: Service
metadata:
  name: ip-correction-backend
  namespace: test
spec:
  type: ClusterIP
  selector:
    app: ip-correction-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: ip-correction-frontend
  namespace: test
spec:
  type: NodePort
  selector:
    app: ip-correction-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
