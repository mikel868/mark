services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: appeal
      POSTGRES_USER: appeal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - appeal-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appeal -d appeal"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/appeal
      DB_USERNAME: appeal
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:?Set admin username}
      INITIAL_ADMIN_PASSWORD_HASH: ${INITIAL_ADMIN_PASSWORD_HASH:?Set admin bcrypt hash}
      INITIAL_READONLY_USERNAME: ${INITIAL_READONLY_USERNAME:?Set readonly username}
      INITIAL_READONLY_PASSWORD_HASH: ${INITIAL_READONLY_PASSWORD_HASH:?Set readonly bcrypt hash}
      SECURE_COOKIE: ${SECURE_COOKIE:-true}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  appeal-data:
