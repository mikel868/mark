name: Backend checks
on:
  push:
    branches: ['**']
    paths: ['backend/**', '.github/workflows/backend.yml', '.gitignore', 'docs/**', 'README.md']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml', '.gitignore', 'docs/**', 'README.md']
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: backend
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: chmod +x mvnw
      - run: env -u TEST_DB_URL -u TEST_DB_USERNAME -u TEST_DB_PASSWORD ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/
