name: Frontend checks

on:
  workflow_call:
  push:
    branches-ignore: ['main']
    paths:
      [
        'frontend/**',
        '.github/workflows/frontend.yml',
        '.gitignore',
        '.nvmrc',
        'docs/**',
        'README.md',
      ]
  pull_request:
    paths:
      [
        'frontend/**',
        '.github/workflows/frontend.yml',
        '.gitignore',
        '.nvmrc',
        'docs/**',
        'README.md',
      ]

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: frontend

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:secrets
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image and verify static routing (backend deliberately absent)
        env:
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          name="mark-frontend-ci-$RUN_KEY"
          trap 'docker rm -f "$name-probe" "$name" >/dev/null 2>&1 || true; docker network rm "$name" >/dev/null 2>&1 || true; docker image rm "$name" >/dev/null 2>&1 || true' EXIT
          docker build -t "$name" .
          docker network create "$name"
          docker run -d --name "$name" --network "$name" "$name"
          docker run --rm -i --name "$name-probe" --network "$name" \
            -e APP_URL="http://$name" node:24-alpine node --input-type=module < tests/smoke/container-smoke.mjs
